name: untitled_dev
services:
  untitled_dev_db-service:
    container_name: untitled_dev_db-container
    restart: always
    image: postgres:latest
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
      POSTGRES_DB: dbname
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
    command: ["postgres", "-c", "log_checkpoints=off"]
    networks:
      - backend-network

  untitled_dev_web-service:
    container_name: untitled_dev_web-container
    restart: always
    image: untitled_dev_web-image
    build:
      context: ./web
      target: dev
      args:
        - PORT=5173
    environment:
      - BETTER_AUTH_SECRET=REDACTED
      - BETTER_AUTH_URL=http://192.168.8.103:8083
      # refer to db service auth details
      - DB_URL=postgres://dbuser:dbpass@untitled_dev_db-service:5432/dbname
      - PUBLIC_APP_TITLE=UNTITLED
    volumes:
      - ./web:/app
    networks:
      - web-network
      - gateway-network
      - backend-network

  untitled_dev_gateway-service:
    container_name: untitled_dev_gateway-container
    image: nginx:latest
    restart: always
    ports:
      - 8083:8083
    environment:
      - HOST=192.168.8.103
      - PORT=8083
      - WEB_SERVICE=untitled_dev_web-service:5173
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - gateway-network

volumes:
  db-data:

networks:
  gateway-network:
  web-network:
  backend-network:
