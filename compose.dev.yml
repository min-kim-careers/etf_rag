name: dating-app_dev
services:
  dating-app_dev_api-db-service:
    container_name: dating-app_dev_api-db-container
    restart: always
    image: postgres:latest
    environment:
      POSTGRES_USER: apidbuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: apidb
    volumes:
      - api-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
    command: ["postgres", "-c", "log_checkpoints=off"]
    networks:
      - api-network

  dating-app_dev_api-service:
    container_name: dating-app_dev_api-container
    image: dating-app_dev_api-image
    restart: always
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    environment:
      - DB_HOST=dating-app_dev_api-db-service
      - CACHE_HOST=dating-app_dev_api-cache-service
    env_file:
      - ./api/.env
    volumes:
      - ./api/app:/code/app
      - venv:/code/.venv
      - pip:/root/.cache/pip
    networks:
      - api-network
      - web-network

  dating-app_dev_web-service:
    container_name: dating-app_dev_web-container
    image: dating-app_dev_web-image
    build:
      context: ./web
      target: dev
    environment:
      - PORT=5173
    volumes:
      - ./web:/app
    networks:
      - web-network
      - gateway-network

  dating-app_dev_gateway-service:
    container_name: dating-app_dev_gateway-container
    image: nginx:latest
    ports:
      - 8083:8083
    env_file:
      - ./web/.env
    environment:
      - HOST=192.168.8.103
      - PORT=8083
      - WEB_SERVICE=dating-app_dev_web-service:5173
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - gateway-network
    depends_on:
      - dating-app_dev_web-service

volumes:
  api-db-data:
  venv:
  pip:

networks:
  gateway-network:
  web-network:
  api-network:
