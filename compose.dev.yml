name: etf_dev
services:
  etf_dev_db-service:
    container_name: etf_dev_db-container
    restart: always
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
      POSTGRES_DB: dbname
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["postgres", "-c", "log_checkpoints=off"]
    networks:
      - backend-network

  etf_dev_api-service:
    container_name: etf_dev_api-container
    image: etf_dev_api-image
    restart: always
    ports:
      - 8000:8000
    build:
      context: ./api
      dockerfile: Dockerfile
      target: dev
    environment:
      # Refer to DB service authentication details
      - DB_URL=dbuser:dbpass@etf_dev_db-service:5432/dbname
      - EMBEDDING_URL=http://etf_dev_ollama-service:11434/v1/embeddings
      - EMBEDDING_MODEL=nomic-embed-text
    volumes:
      - ./api/app:/code/app
      - venv:/code/.venv
      - pip:/root/.cache/pip
    networks:
      - backend-network

  etf_dev_ollama-service:
    container_name: etf_dev_ollama-container
    restart: always
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - backend-network

  etf_dev_web-service:
    container_name: etf_dev_web-container
    restart: always
    image: etf_dev_web-image
    build:
      context: ./web
      target: dev
      args:
        - PORT=5173
        - PUBLIC_APP_TITLE=ETF
    environment:
      - PUBLIC_APP_TITLE=ETF

      # Refer to DB service authentication details
      - DB_URL=postgres://dbuser:dbpass@etf_dev_db-service:5432/dbname

      - GEMINI_API_KEY=REDACTED

      - BETTER_AUTH_URL=http://192.168.8.103:8083
      - BETTER_AUTH_SECRET=REDACTED

      - API_URL=http://etf_dev_api-service:8000
      - OLLAMA_URL=http://etf_dev_ollama-service:11434

      # Home PC
      - LOCAL_LLM_URL=http://192.168.8.170:9090

    volumes:
      - ./web:/app
    networks:
      - web-network
      - gateway-network
      - backend-network

  etf_dev_gateway-service:
    container_name: etf_dev_gateway-container
    image: nginx:latest
    restart: always
    ports:
      - 8083:80
    environment:
      - HOST=192.168.8.103
      - WEB_SERVICE=http://etf_dev_web-service:5173
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - gateway-network

volumes:
  ollama_data:
  db-data:
  venv:
  pip:

networks:
  gateway-network:
  web-network:
  backend-network:
