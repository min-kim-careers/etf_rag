name: etf_prod
services:
  etf_prod_db-service:
    container_name: etf_prod_db-container
    restart: always
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass
      POSTGRES_DB: dbname
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["postgres", "-c", "log_checkpoints=off"]
    networks:
      - backend-network

  etf_prod_api-service:
    container_name: etf_prod_api-container
    image: etf_prod_api-image
    restart: always
    ports:
      - 8001:8000
    build:
      context: ./api
      dockerfile: Dockerfile
      target: prod
    environment:
      # Refer to DB service authentication details
      - DB_URL=dbuser:dbpass@etf_prod_db-service:5432/dbname
      - EMBEDDING_URL=http://etf_prod_ollama-service:11434/v1/embeddings
      - EMBEDDING_MODEL=nomic-embed-text
    volumes:
      - ./api/app:/code/app
      - venv:/code/.venv
      - pip:/root/.cache/pip
    networks:
      - backend-network

  etf_prod_ollama-service:
    container_name: etf_prod_ollama-container
    restart: always
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      - backend-network

  etf_prod_web-service:
    container_name: etf_prod_web-container
    image: etf_prod_web-image
    build:
      context: ./web
      target: prod
      args:
        - PORT=3000
        - PUBLIC_APP_TITLE=ETF
    environment:
      - PUBLIC_APP_TITLE=ETF

      # Refer to DB service authentication details
      - DB_URL=postgres://dbuser:dbpass@etf_prod_db-service:5432/dbname

      - GEMINI_API_KEY=REDACTED

      - BETTER_AUTH_URL=https://etf.kibon.dev
      - BETTER_AUTH_SECRET=REDACTED

      - API_URL=http://etf_prod_api-service:8000
      - OLLAMA_URL=http://etf_prod_ollama-service:11434

      - LOCAL_LLM_URL=http://192.168.8.170:9090

    networks:
      - backend-network
      - gateway-network

  etf_prod_gateway-service:
    container_name: etf_prod_gateway-container
    image: nginx:latest
    environment:
      - HOST=etf.kibon.dev
      - WEB_SERVICE=http://etf_prod_web-service:3000
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - gateway-network
      - tunnel-network

volumes:
  ollama_data:
  db-data:
  venv:
  pip:

networks:
  backend-network:
  gateway-network:
  tunnel-network:
    name: prod_tunnel_network
    external: true
