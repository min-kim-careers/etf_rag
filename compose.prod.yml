  etf_prod_web-service:
    container_name: etf_prod_web-container
    image: etf_prod_web-image
    build:
      context: ./web
      target: prod
      args:
        - HOST=etf.kibon.dev
        - PORT=3000
    networks:
      # - web-network
      - gateway-network

  etf_prod_gateway-service:
    container_name: etf_prod_gateway-container
    image: nginx:latest
    ports:
      - 83:83
    environment:
      - HOST=etf.kibon.dev
      - PORT=83
      - WEB_SERVICE=etf_prod_web-service:3000
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - gateway-network
      - tunnel-network
    depends_on:
      - etf_prod_web-service

